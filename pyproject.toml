[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soma-pathology"
version = "1.8.0"
description = "Modular experimentation framework for computational pathology"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Clément Grisi", email = "clement.grisi@radboudumc.nl" },
]
keywords = ["computational-pathology", "whole-slide-images", "mil", "pytorch", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "Pillow",
    "h5py",
    "torch",
    "scikit-learn",
    "scikit-survival",
    "scipy>=1.11",
    "pyyaml",
    "rich",
    "timm",
    "huggingface-hub",
    "safetensors",
    "transformers",
    "hs2p>=4.3.0",
    "slide2vec[fm]>=5.5.0",
    "matplotlib>=3.7",
]

[project.scripts]
soma = "soma.__main__:entrypoint"

[project.urls]
Homepage = "https://github.com/clemsgrs/soma"
Source = "https://github.com/clemsgrs/soma"
Issues = "https://github.com/clemsgrs/soma/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Curation-only dependencies for the HEST-Benchmark spatial_expression curator
# (soma.curation.hest). Lazy-imported inside curate_hest so `import soma` and core CI
# never require them: anndata reads the per-slide gene-expression .h5ad, h5py the patch
# HDF5. log1p targets are computed with numpy (already a core dep).
hest = [
    # >=0.11 for `anndata.settings`, which the curation tests need to silence the pandas>=3
    # nullable-string write guard when building fixtures. An unpinned resolve that lands on
    # 0.10.x satisfies this extra but then fails test collection outright.
    "anndata>=0.11",
    "h5py",
]
docs = [
    "sphinx>=8.1",
    "furo",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
    "nbsphinx",
    "ipykernel",
    "ipywidgets",
]

[tool.hatch.build]
exclude = [
    "/soma/**/.ipynb_checkpoints",
]

[tool.hatch.build.targets.wheel]
packages = ["soma"]
include = [
    "soma/configs/*.yaml",
    "soma/benchmarks/configs/**/*.yaml",
    "soma/benchmarks/reference/*.csv",
    "soma/benchmarks/results/*.csv",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "soma",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soma"
version = "0.1.0"
description = "Modular experimentation framework for computational pathology"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Clement Grisi", email = "clement.grisi@radboudumc.nl" },
]
keywords = ["computational-pathology", "whole-slide-images", "mil", "pytorch", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "timm>=1.0",
    "huggingface-hub>=0.20",
    "safetensors>=0.4",
    "opencv-python-headless",
]

[project.urls]
Homepage = "https://github.com/clemsgrs/soma"
Source = "https://github.com/clemsgrs/soma"
Issues = "https://github.com/clemsgrs/soma/issues"

[project.optional-dependencies]
wsi = [
    "openslide-python",
    "openslide-bin",
]
cucim = [
    "cucim>=24.0",
]
transformers = [
    "transformers>=4.35",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
all = ["soma[wsi,cucim,transformers,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["soma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soma-pathology"
version = "1.19.0"
description = "Modular experimentation framework for computational pathology"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Clément Grisi", email = "clement.grisi@radboudumc.nl" },
]
keywords = ["computational-pathology", "whole-slide-images", "mil", "pytorch", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow>=17,<26",  # predictions parquet; 26 needs NumPy 2, the torch stack still resolves NumPy 1.26
    "Pillow",
    "h5py",
    "torch",
    "torchvision>=0.23",  # tv_tensors.KeyPoints: joint pixel + point augmentation
    "scikit-image",
    "scikit-learn",
    "scikit-survival",
    "scipy>=1.11",
    "pyyaml",
    "rich",
    "timm",
    "huggingface-hub",
    "safetensors",
    "transformers",
    "hs2p>=6.1.0",
    "slide2vec[fm]>=7.1.2",  # prism extra no longer caps torch<2.8, so torchvision>=0.23 resolves
    "matplotlib>=3.7",
    "croma>=1.0.0",
]

[project.scripts]
soma = "soma.__main__:entrypoint"

[project.urls]
Homepage = "https://github.com/clemsgrs/soma"
Source = "https://github.com/clemsgrs/soma"
Issues = "https://github.com/clemsgrs/soma/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "import-linter>=2.1",  # lint-imports checks the import rule (ADR 0022) in CI
]
croma = [
    "pyarrow>=17,<26",  # 26 needs NumPy 2; the torch stack still resolves NumPy 1.26
]
# Curation-only dependencies for the HEST-Benchmark curator
# (soma.benchmark.hest.curate). Lazy-imported inside curate_hest so `import soma` and core CI
# never require them: anndata reads the per-slide gene-expression .h5ad, h5py the patch
# HDF5. log1p targets are computed with numpy (already a core dep).
hest = [
    # >=0.11 for `anndata.settings`, which the curation tests need to silence the pandas>=3
    # nullable-string write guard when building fixtures. An unpinned resolve that lands on
    # 0.10.x satisfies this extra but then fails test collection outright.
    "anndata>=0.11",
    "h5py",
]
docs = [
    "sphinx>=8.1",
    "furo",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
    "nbsphinx",
    "ipykernel",
    "ipywidgets",
]

[tool.hatch.build]
exclude = [
    "/soma/**/.ipynb_checkpoints",
]

[tool.hatch.build.targets.wheel]
packages = ["soma"]
# Each benchmark protocol's package data: its committed configs, reference rows (and
# their provenance) and results ledgers.
include = [
    "soma/benchmark/*/configs/*.yaml",
    "soma/benchmark/*/*.csv",
    "soma/benchmark/*/*.json",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "soma",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: end-to-end scenario through the soma CLI on synthetic data (tests/e2e/)",
]

# The import rule (design §2, ADR 0022). CI runs `lint-imports` before the suite. The tests
# are a second root package so contract 5 can hold them to the public API (ADR 0023).
[tool.importlinter]
root_packages = ["soma", "tests"]

[[tool.importlinter.contracts]]
id = "layers"
name = "soma.cli > soma.benchmark > the rest of soma"
type = "layers"
containers = ["soma"]
layers = [
    "cli",
    "benchmark",
    "config : plan : pipeline : presets : data : extract : models : learn : evaluation : testing : registry : discovery : _internal",
]
exhaustive = true
exhaustive_ignores = ["__main__"]

[[tool.importlinter.contracts]]
id = "protocols-independent"
name = "The benchmark protocols do not import each other"
type = "independence"
modules = [
    "soma.benchmark.eva",
    "soma.benchmark.hest",
    "soma.benchmark.ocelot",
    "soma.benchmark.midog",
    "soma.benchmark.monkey",
    "soma.benchmark.croma",
]

[[tool.importlinter.contracts]]
id = "benchmark-public-api"
name = "The benchmark package imports no private module"
type = "forbidden"
source_modules = ["soma.benchmark"]
forbidden_modules = [
    "soma._internal",
    "soma.extract.cache._types",
    "soma.testing._cohort",
    "soma.testing._encoder",
    "soma.testing._errors",
    "soma.testing._learner",
    "soma.testing._task_head",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "verbs-config-free"
name = "No core namespace but the pipeline and the presets imports soma.config or soma.plan"
type = "forbidden"
source_modules = [
    "soma.data",
    "soma.extract",
    "soma.models",
    "soma.learn",
    "soma.evaluation",
    "soma.testing",
    "soma._internal",
    "soma.registry",
    "soma.discovery",
]
forbidden_modules = ["soma.config", "soma.plan"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "tests-public-api"
name = "The tests import no private module"
type = "forbidden"
source_modules = ["tests"]
forbidden_modules = [
    "soma._internal",
    "soma.extract.cache._types",
    "soma.testing._cohort",
    "soma.testing._encoder",
    "soma.testing._errors",
    "soma.testing._learner",
    "soma.testing._task_head",
]
allow_indirect_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soma"
version = "0.1.0"
description = "Modular experimentation framework for computational pathology"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Clément Grisi", email = "clement.grisi@radboudumc.nl" },
]
keywords = ["computational-pathology", "whole-slide-images", "mil", "pytorch", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "scipy>=1.11",
    "pyyaml",
    "timm",
    "huggingface-hub",
    "safetensors",
    "transformers",
    "slide2vec[fm]>=4.3.0",
    "plotly>=5.0",
]

[project.scripts]
soma = "soma.cli:main"

[project.urls]
Homepage = "https://github.com/clemsgrs/soma"
Source = "https://github.com/clemsgrs/soma"
Issues = "https://github.com/clemsgrs/soma/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
docs = [
    "sphinx>=8.1",
    "furo",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]

[tool.hatch.build.targets.wheel]
packages = ["soma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soma-pathology"
version = "1.4.0"
description = "Modular experimentation framework for computational pathology"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Clément Grisi", email = "clement.grisi@radboudumc.nl" },
]
keywords = ["computational-pathology", "whole-slide-images", "mil", "pytorch", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "scikit-survival",
    "scipy>=1.11",
    "pyyaml",
    "timm",
    "huggingface-hub",
    "safetensors",
    "transformers",
    "hs2p>=4.1.0",
    "slide2vec[fm]>=4.7.0",
    "matplotlib>=3.7",
]

[project.scripts]
soma = "soma.__main__:entrypoint"

[project.urls]
Homepage = "https://github.com/clemsgrs/soma"
Source = "https://github.com/clemsgrs/soma"
Issues = "https://github.com/clemsgrs/soma/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
docs = [
    "sphinx>=8.1",
    "furo",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
    "nbsphinx",
    "ipykernel",
    "ipywidgets",
]

[tool.hatch.build]
exclude = [
    "/soma/**/.ipynb_checkpoints",
]

[tool.hatch.build.targets.wheel]
packages = ["soma"]
include = ["soma/configs/*.yaml"]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "soma",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

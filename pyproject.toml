[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soma"
version = "0.1.0"
description = "Modular experimentation framework for computational pathology"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "timm>=1.0",
    "huggingface-hub>=0.20",
    "safetensors>=0.4",
]

[project.optional-dependencies]
wsi = [
    "openslide-python>=1.3",
]
cucim = [
    "cucim>=24.0",
]
transformers = [
    "transformers>=4.35",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
all = ["soma[wsi,transformers,dev]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# BEETLE breast-cancer semantic segmentation — slide-manifest dense path (soma #93).
#
# WSIs + multiresolution annotation masks flow through dataset_type="segmentation"
# with a masks:/sampling: block: soma runs hs2p annotation sampling per slide to pick
# ROIs, asks slide2vec to encode each ROI into a dense token grid, caches the grids,
# and trains a lightweight conv decoder + parameter-free SegmentationHead.
#
# The dataset_csv / splits_csv are the SLIDE-LEVEL manifest + splits emitted by
#   python -m examples.beetle.curate
# (one row per WSI: sample_id, image_path (WSI), label_mask_path (annotation raster); splits
# carry BEETLE's predefined CV folds, slide-level — soma never partitions, ROIs inherit).
# Those artifacts carry absolute paths and live under data/beetle/ (gitignored); point
# these two keys at wherever you generated them.

run:
  output_root: data/beetle/runs/segmentation_beetle_phikon
  seed: 0
  tags:
    - beetle
    - segmentation
    - phikon

data:
  dataset_csv: data/beetle/curated_slide_manifest/manifest.csv
  splits_csv: data/beetle/curated_slide_manifest/splits.csv
  dataset_type: segmentation
  feature_mode: cached

preprocessing:
  backend: auto
  # 512 px supervision tile read spacing-aware at 0.5 µm/px (no resample): the BEETLE
  # masks are ~0.485 µm/px so 0.5 is faithful and keeps the fixed 512 tile size.
  requested_tile_size_px: 512
  requested_spacing_um: 0.5
  tolerance: 0.05
  # phikon is an HF ViT-B/16 that only accepts its native 224 px, so slide a 224 window
  # (16 px patch -> 14x14 grid) over the padded 512 tile at 0.5 overlap and blend.
  dense_window_size: 224
  dense_window_overlap: 0.5
  # Annotation-mask -> class scheme (mirrors hs2p's masks config 1:1; nests under
  # preprocessing since annotation-based tile selection is a preprocessing concern, #109).
  # pixel_mapping is the class name -> RAW BEETLE pixel value; "background" (unannotated,
  # value 0) is the ignore label. soma derives the raw-pixel -> class-index remap (other->0,
  # non_invasive->1, invasive->2, necrosis->3; unannotated -> ignore_index 255).
  masks:
    pixel_mapping:
      background: 0                  # unannotated -> ignore_index (255), excluded from loss/metrics
      other: 1                       # -> class 0
      non_invasive_epithelium: 2     # -> class 1
      invasive_epithelium: 3         # -> class 2
      necrosis: 4                    # -> class 3
    # Keep a tile only if >=5% of its pixels are annotated (any annotated class), per the
    # baseline's ANNOTATED_FRACTION_MIN. joint_sampling unions all classes then thresholds.
    min_coverage:
      other: 0.05
      non_invasive_epithelium: 0.05
      invasive_epithelium: 0.05
      necrosis: 0.05
  sampling:
    strategy: joint
    output_mode: merged

cache:
  enabled: true   # extract the dense grids once, reuse across folds

encoder:
  name: phikon
  batch_size: 8
  allow_non_recommended_settings: true

decoder:
  name: lightweight_conv

task:
  name: segmentation
  params:
    num_classes: 4

evaluation:
  metrics:
    - mean_dice
    - mean_iou
    - dice_per_class

training:
  epochs: 30
  learning_rate: 1.0e-4
  batch_size: 4
  patience: 8
  num_workers: 4

# Slide-level regression with ABMIL
# Typical use case: predicting a continuous biomarker score from a slide
# Run with: soma run examples/slide_regression.yaml

dataset_csv: data/dataset.csv
splits_csv: data/splits.csv
output_root: runs/regression

dataset_type: slide

preprocessing:
  # spacing and tile size are auto-resolved from the encoder's preset values
  tissue_threshold: 0.1

cache:
  enabled: true
  # root_dir defaults to <output_root>/ (feature_cache/ and tiling_cache/ alongside) — set explicitly to share across runs

encoder:
  name: uni2

aggregator:
  name: abmil

task:
  name: regression

eval:
  metrics:
    - mae
    - r2
    - spearman

training:
  epochs: 50
  learning_rate: 1.0e-4
  patience: 10

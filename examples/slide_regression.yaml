run:
  output_root: runs/regression
  seed: 0
  tags: []

data:
  # dataset.csv carries the regression target in a `value` column; map another column
  # name with `task.targets` below.
  dataset_csv: data/dataset.csv
  splits_csv: data/splits.csv
  dataset_type: slide

preprocessing:
  min_coverage:
    tissue: 0.1

cache:
  enabled: true

encoder:
  name: uni2

aggregation:
  name: abmil

task:
  name: regression
  # targets: {value: label}  # target key -> CSV column, when the names differ

evaluation:
  metrics:
    - mae
    - r2
    - spearman

training:
  epochs: 50
  learning_rate: 1.0e-4
  patience: 10

# Slide-level regression with ABMIL
# Typical use case: predicting a continuous biomarker score from a slide
# Run with: soma run examples/slide_regression.yaml

dataset_csv: data/dataset.csv
splits_csv: data/splits.csv
output_root: runs/regression

dataset_type: slide

preprocessing:
  requested_spacing_um: 0.5
  requested_tile_size_px: 256
  tissue_threshold: 0.1

cache:
  enabled: true
  root_dir: shared/feature_cache

encoder:
  name: uni2
  spacing_um: 0.5

aggregator:
  name: abmil

task:
  name: regression

eval:
  metrics:
    - mae
    - r2
    - spearman

training:
  epochs: 50
  learning_rate: 1.0e-4
  patience: 10

run:
  output_dir: runs/regression
  seed: 0

cohort:
  # dataset.csv carries the regression target in a `value` column; map another column
  # name with the head's `targets` below.
  records: data/dataset.csv
  splits: data/splits.csv

features:
  encoder:
    name: uni2
  extraction:
    # hs2p's binary tissue vocabulary; tiles with >= 10% tissue are kept.
    masks:
      pixel_mapping: {background: 0, tissue: 1}
      min_coverage: {tissue: 0.1}

learner:
  name: mil
  params:
    aggregator:
      name: abmil
    head:
      name: regression
      # params:
      #   targets: {value: label}  # target key -> CSV column, when the names differ
    optimizer:
      name: adam
      params: {lr: 1.0e-4, weight_decay: 1.0e-5}
    scheduler: cosine

trainer:
  max_epochs: 50
  callbacks:
    - name: checkpoint
    - name: early_stopping
      params: {patience: 10}

evaluation:
  metrics:
    - mae
    - r2
    - spearman

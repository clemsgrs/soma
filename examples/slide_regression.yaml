run:
  output_root: runs/regression
  seed: 0
  tags: []

data:
  dataset_csv: data/dataset.csv
  splits_csv: data/splits.csv
  dataset_type: slide

preprocessing:
  tissue_threshold: 0.1

cache:
  enabled: true

encoder:
  name: uni2

aggregation:
  name: abmil

task:
  name: regression

evaluation:
  metrics:
    - mae
    - r2
    - spearman

training:
  epochs: 50
  learning_rate: 1.0e-4
  patience: 10

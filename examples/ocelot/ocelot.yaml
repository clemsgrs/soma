# OCELOT 2023 cell-detection — detection-v1 baseline (single encoder, lightweight_conv).
#
# Frozen CONCH -> dense token grid -> conv decoder -> per-class peak heatmap, scored
# with class-aware F1@δ (δ = 3 µm = 15 px at 0.2 µm/px, OCELOT's official tolerance).
# See examples/ocelot/README.md for the full workflow. Curate the dataset first:
#   python -m soma.curation.ocelot \
#     --raw-root   /data/pathology/projects/clement/code/soma/data/ocelot \
#     --output-dir /data/pathology/projects/clement/code/soma/data/ocelot/curated
# Then run:  python -m soma examples/ocelot/ocelot.yaml

run:
  output_root: output/ocelot_conch_lightconv
  seed: 0
  tags: [ocelot, detection, conch, lightweight_conv, baseline]

data:
  dataset_csv: /data/pathology/projects/clement/code/soma/data/ocelot/curated/dataset.csv
  splits_csv: /data/pathology/projects/clement/code/soma/data/ocelot/curated/splits.csv
  dataset_type: detection

preprocessing:
  # OCELOT cell patches are flat 1024x1024 JPEGs at ~0.194 µm/px; the reader reads them
  # at native resolution (spacing is bookkeeping that pins the µm->px conversions).
  # CONCH's timm ViT-B/16 trunk is built (by open_clip) without dynamic_img_size, so dense
  # extraction uses the native 448 window; 0.25 overlap covers the non-even tiling of 1024
  # and blends window seams / border artifacts.
  requested_tile_size_px: 1024
  requested_spacing_um: 0.2
  dense_window_size: 448
  dense_window_overlap: 0.25

encoder:
  name: conch
  batch_size: 8
  allow_non_recommended_settings: true   # reading at 0.2 µm/px vs CONCH's 0.5 native

decoder:
  name: lightweight_conv

task:
  name: detection
  params:
    num_classes: 2            # 0 = BC (background cell), 1 = TC (tumor cell)
    match_distance: 3.0       # δ in µm -> 15 px at 0.2 µm/px (OCELOT-official)
    sigma: 1.0                # target Gaussian σ in µm -> 5 px (≈ δ/3)
    matching: hungarian       # headline; greedy is OCELOT's official scorer
    foreground_weight: 10.0

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall, mean_f1_per_image]

training:
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adam
  scheduler: cosine
  patience: 10
  monitor: mean_f1
  monitor_mode: max
  # Decoder upsamples the grid to a 1024x1024x2 heatmap; batch 1 on a 12 GB card
  batch_size: 1
  gradient_accumulation: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true

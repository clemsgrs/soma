run:
  output_dir: runs/survival
  seed: 0

cohort:
  # dataset.csv carries the survival head's targets as same-named columns: `time`
  # (time-to-event), `event` (0/1) and `bin` (the discrete bin containing `time`, for
  # every sample including censored ones — compute these yourself, e.g. via qcut on
  # uncensored times). A CSV that stores the time under another column name (e.g. a
  # legacy `label`) maps it with the head's `targets` below instead of being rewritten.
  records: data/dataset.csv
  splits: data/splits.csv

features:
  encoder:
    name: uni2
  extraction:
    # hs2p's binary tissue vocabulary; tiles with >= 10% tissue are kept.
    masks:
      pixel_mapping: {background: 0, tissue: 1}
      min_coverage: {tissue: 0.1}

learner:
  name: mil
  params:
    # CLAM / DTFD-MIL are not supported for survival; use abmil, transmil, mean_pool.
    aggregator:
      name: abmil
    head:
      name: survival
      params:
        alpha: 0.15  # up-weighting of the uncensored NLL term (HIPT default)
        # targets: {time: label}  # target key -> CSV column, when the names differ
    optimizer:
      name: adam
      params: {lr: 1.0e-4, weight_decay: 1.0e-5}
    scheduler: cosine

trainer:
  max_epochs: 50
  callbacks:
    # Selects and early-stops on tune NLL by default; to use C-index instead, set
    # params {monitor: c_index, mode: max} on both callbacks.
    - name: checkpoint
    - name: early_stopping
      params: {patience: 10}

evaluation:
  metrics:
    - c_index

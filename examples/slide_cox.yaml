run:
  output_root: runs/cox
  seed: 0
  tags: []

data:
  # dataset.csv reuses `label` for time-to-event and adds `event` (0/1). Unlike
  # the discrete-time NLL path, Cox needs no `bin` column.
  dataset_csv: data/dataset.csv
  splits_csv: data/splits.csv
  dataset_type: slide

preprocessing:
  min_coverage:
    tissue: 0.1

cache:
  enabled: true

encoder:
  name: uni2

# Padded mode (shown here): the risk set is the batch. Use single-embedding
# slide-level features with no aggregator, OR a MIL aggregator (abmil / transmil
# / mean_pool) on tile-bag features — masking keeps padded bags exact. For large
# variable-size bags, prefer accumulation mode (see the commented block below) to
# avoid padding memory.
aggregation: null

task:
  name: survival
  params:
    loss: cox                 # selects the CoxPH path; default is nll (discrete-time)
    ties: breslow             # only Breslow ties are implemented
    min_events_per_window: 1  # event floor the sampler guarantees per batch/window
    # cox_window: 48          # >= 2 switches to accumulation mode (see below)

evaluation:
  metrics:
    - c_index

training:
  epochs: 50
  learning_rate: 1.0e-4
  patience: 10
  # Padded mode: the risk set IS the batch — raise batch_size to enlarge it (less
  # biased Cox gradient). gradient_accumulation must stay 1 (it makes several small
  # risk sets, not one large one), and batch_size must be >= 2.
  batch_size: 32
  gradient_accumulation: 1
  # Early-stop on the full-cohort tune partial likelihood by default; to early-stop
  # on C-index instead:
  # monitor: c_index
  # monitor_mode: max

# --- Accumulation mode (large variable-size MIL bags) ---
# Set an MIL aggregator and task.params.cox_window >= 2, with batch_size = 1:
#
# aggregation:
#   name: abmil
# task:
#   name: survival
#   params:
#     loss: cox
#     cox_window: 48          # risk-set size = bags forwarded per Cox loss
# training:
#   batch_size: 1             # required: bags are forwarded un-padded, one at a time
#   learning_rate: 5.0e-4     # ~cox_window x fewer steps/epoch -> budget a higher LR
#   epochs: 100               #   and/or more epochs, or training appears to stall

run:
  output_root: runs/ordinal
  seed: 0
  tags: []

data:
  dataset_csv: data/dataset.csv
  splits_csv: data/splits.csv
  dataset_type: slide

preprocessing:
  min_coverage:
    tissue: 0.1

cache:
  enabled: true

encoder:
  name: uni2

aggregation:
  name: abmil

task:
  name: ordinal_classification

evaluation:
  metrics:
    - qwk
    - balanced_accuracy
    - mae

training:
  epochs: 50
  learning_rate: 1.0e-4
  patience: 10

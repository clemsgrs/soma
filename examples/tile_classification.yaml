run:
  output_root: runs/tile_classifier
  seed: 0
  tags: []

data:
  dataset_csv: data/dataset.csv
  splits_csv: data/splits.csv
  dataset_type: tile

preprocessing: {}

cache:
  enabled: true

encoder:
  name: uni2

aggregation: null

task:
  name: binary_classification

evaluation:
  metrics:
    - auroc
    - balanced_accuracy
    - f1

training:
  epochs: 30
  learning_rate: 1.0e-4
  patience: 5

run:
  output_dir: runs/tile_classifier
  seed: 0

cohort:
  records: data/dataset.csv
  splits: data/splits.csv

# One row is one tile image: a tile encoder without an aggregator embeds each image
# whole, so there is no tiling and no bag.
features:
  encoder:
    name: uni2

learner:
  name: mil
  params:
    head:
      name: binary_classification
    optimizer:
      name: adam
      params: {lr: 1.0e-4, weight_decay: 1.0e-5}
    scheduler: cosine

trainer:
  max_epochs: 30
  callbacks:
    - name: checkpoint
    - name: early_stopping
      params: {patience: 5}

evaluation:
  metrics:
    - auroc
    - balanced_accuracy
    - f1

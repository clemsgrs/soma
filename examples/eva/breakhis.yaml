run:
  output_dir: runs/eva_breakhis_uni
  seed: 0

cohort:
  records: data/eva/breakhis/dataset.csv
  splits: data/eva/breakhis/splits.csv
  tune_is_test: true  # eva reports on its validation split, soma's test

# One row is one tile image: a tile encoder without an aggregator embeds each whole.
features:
  encoder:
    name: uni
  execution:
    batch_size: 32

loaders:
  batch_size: 256

learner:
  name: mil
  params:
    head:
      name: multiclass_classification
    optimizer:
      name: adamw
      params: {lr: 3.0e-4, weight_decay: 0.0}

trainer:
  max_epochs: 1000
  callbacks:
    - name: checkpoint
      params: {monitor: balanced_accuracy, mode: max}
    - name: early_stopping
      params: {monitor: balanced_accuracy, mode: max, patience: 100}

evaluation:
  metrics:
    - balanced_accuracy

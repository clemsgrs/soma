run:
  output_root: runs/eva_mhist_uni
  seed: 0
  tags:
    - eva
    - mhist
    - uni

data:
  dataset_csv: data/eva/mhist/dataset.csv
  splits_csv: data/eva/mhist/splits.csv
  dataset_type: tile

preprocessing: {}

cache:
  enabled: true

encoder:
  name: uni
  batch_size: 32

aggregation: null

task:
  name: binary_classification

evaluation:
  metrics:
    - balanced_accuracy

training:
  epochs: 1000
  learning_rate: 3.0e-4
  weight_decay: 0.0
  optimizer: adamw
  scheduler: none
  patience: 100
  monitor: balanced_accuracy
  monitor_mode: max
  batch_size: 256
  tune_is_test: true
  num_workers: 0
  pin_memory: false
  persistent_workers: false

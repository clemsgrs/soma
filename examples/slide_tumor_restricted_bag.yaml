# Annotation-restricted merged bag (soma #110).
#
# A whole-slide MIL run whose bag is restricted to the tumor compartment: each slide's
# `mask_path` annotation raster gates tile selection by per-class coverage, so only tiles
# that are >= 50% tumor enter the bag (tissue-only tiles are excluded). The restricted bag
# carries its ordinary slide-level `label` and flows through the usual aggregator + head:
# the masks block changes *which* tiles are sampled, nothing else.
run:
  output_dir: runs/tumor_restricted_bag
  seed: 0

cohort:
  # dataset.csv rows are (sample_id, image_path, mask_path, label): mask_path is the
  # multi-class annotation raster named by features.extraction.masks.pixel_mapping; label
  # is the ordinary slide-level classification target.
  records: data/dataset.csv
  splits: data/splits.csv

features:
  encoder:
    name: uni2
  extraction:
    tiling:
      requested_spacing_um: 0.5
      requested_tile_size_px: 224
      tolerance: 0.05
      overlap: 0.0
    segmentation:
      method: otsu
    # The annotation masks restrict the bag to the tumor compartment. Tile selection gates
    # on per-class min_coverage over the annotation mask (binary tissue filtering is
    # bypassed). pixel_mapping names the raster's classes by their exact pixel value;
    # `background` is optional (omit it if the raster has no unannotated region).
    masks:
      pixel_mapping: {background: 0, tumor: 1}
      min_coverage: {tumor: 0.5}  # keep tiles >= 50% tumor
      output_mode: merged         # one merged bag per slide (required for a slide bag)
      strategy: joint             # 'independent' tiles each class separately

learner:
  name: mil
  params:
    aggregator:
      name: abmil
    head:
      name: binary_classification
    optimizer:
      name: adam
      params: {lr: 1.0e-4, weight_decay: 1.0e-5}
    scheduler: cosine

trainer:
  max_epochs: 50
  callbacks:
    - name: checkpoint
    - name: early_stopping
      params: {patience: 10}

evaluation:
  metrics:
    - auroc
    - balanced_accuracy
    - auprc
    - f1

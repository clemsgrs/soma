# soma reference configuration: every section of soma.ExperimentConfig, each field at
# its default. Generated by docs/_generate_reference.py; do not edit by hand.
#
# A config names its own records, splits, encoder and learner; everything else may be
# left out. Leaf params ({name, params}) are each component's own: `soma list KIND`
# prints them with their defaults, and a run's plan.yaml records every value it used.
# features.execution.num_gpus and num_preprocessing_workers are null here: slide2vec
# resolves them for the machine a run starts on.
# Run with: soma run /path/to/config.yaml

run:
  output_dir: runs
  seed: 0
  folds: null
  run_id: null
  resume: false
  mirror_root: null
cohort:
  records: data/dataset.csv
  splits: data/splits.csv
  collapse: null
  tune_is_test: false
  allow_missing_tune: false
features:
  kind: cached
  encoder:
    name: uni2
    params: {}
  extraction:
    tiling: null
    segmentation:
      method: hsv
      downsample: 64
      sthresh: 8
      sthresh_up: 255
      mthresh: 7
      close: 4
      sam2_checkpoint_path: null
      sam2_config_path: null
      sam2_device: cpu
      sam2_num_workers: null
    filter: null
    preview:
      save_mask_preview: true
      save_tiling_preview: true
      downsample: 32
      tissue_contour_color:
      - 157
      - 219
      - 129
      mask_overlay_alpha: 0.5
    masks:
      pixel_mapping:
        background:
        - 0
        tissue:
        - 1
      colors:
        background: null
        tissue:
        - 157
        - 219
        - 129
      min_coverage:
        tissue: 0.01
      output_mode: per_annotation
      strategy: joint
    requested_region_size_px: null
    region_tile_multiple: null
    read_coordinates_from: null
    read_tiles_from: null
    on_the_fly: true
    save_tiles: false
    gpu_decode: false
    adaptive_batching: false
    use_supertiles: true
    jpeg_backend: pil
    num_cucim_workers: 4
    resume: false
  execution:
    output_dir: null
    output_format: pt
    batch_size: 32
    num_workers_per_gpu: null
    num_preprocessing_workers: null
    num_gpus: null
    precision: null
    output_dtype: null
    prefetch_factor: 4
    save_tile_embeddings: false
    save_slide_embeddings: false
    save_latents: false
    on_image_mismatch: raise
  dense: null
  cache:
    enabled: true
    root_dir: null
    reuse_policy: strict
    validate_payloads: false
    dtype: null
    on_identity_mismatch: error
  spacing_policy: strict
loaders:
  batch_size: 1
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  sampler: null
  augment: null
learner:
  name: mil
  params:
    aggregator:
      name: abmil
      params: {}
    head:
      name: binary_classification
      params: {}
trainer:
  max_epochs: 50
  max_steps: null
  accumulate_grad_batches: 1
  val_every_n_epochs: 1
  device: auto
  precision: fp32
  callbacks:
  - name: checkpoint
    params: {}
  - name: early_stopping
    params: {}
evaluation:
  metrics: []
  subgroups: []
  holdout_test: false
  overwrite_test: false
  save_overlays: true
  save_probabilities: false
  save_heatmaps: false
  attention_heatmaps: null
  representation: null

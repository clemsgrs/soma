# soma reference configuration — canonical nested layout
# Run with: soma /path/to/config.yaml
#
# This file shows the full user-facing YAML shape. For most runs, start from
# this file or from soma/configs/default.yaml and only change the blocks you
# care about.

run:
  # Output directory for run artifacts.
  output_root: runs/my_experiment
  # Run seed used by training and reproducibility helpers.
  seed: 0
  # Free-form labels stored in the run metadata and report.
  tags:
    - baseline

data:
  # Dataset manifest and split manifest.
  dataset_csv: data/dataset.csv
  splits_csv: data/splits.csv
  # Input mode for the pipeline.
  # Options: slide | tile | patient
  dataset_type: slide

preprocessing:
  # WSI backend. Options: auto | openslide | cucim | asap | vips
  backend: auto
  requested_tile_size_px: null
  requested_spacing_um: null
  requested_region_size_px: null
  region_tile_multiple: null
  # Tissue segmentation method. Options: sam2 | hsv | otsu | threshold.
  # Leave empty/unused when pre-computed tissue masks are provided.
  tissue_method: hsv
  tissue_threshold: 0.1
  overlap: 0.0
  seg_downsample: 64
  sam2_device: cpu
  sam2_num_workers: null
  tolerance: 0.05
  ref_tile_size_px: null
  a_t: 4
  tissue_mask_tissue_value: 1
  preview:
    save_mask_preview: true
    save_tiling_preview: true
    downsample: 32
    tissue_contour_color: [37, 94, 59]

execution:
  num_gpus: null
  num_workers: null
  num_preprocessing_workers: null
  prefetch_factor: null
  persistent_workers: null
  precision: null

cache:
  enabled: true
  root_dir: null
  reuse_policy: strict

encoder:
  # Foundation-model encoder.
  name: uni2
  batch_size: 32
  adaptive_batching: false
  output_variant: null
  allow_non_recommended_settings: false
  save_tile_features: false

aggregation:
  # MIL aggregator.
  name: abmil
  params:
    hidden_dim: 256
    dropout: 0.25

task:
  name: binary_classification
  params: {}

evaluation:
  metrics:
    - auroc
    - balanced_accuracy
  subgroups:
    columns: []

training:
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adam
  scheduler: cosine
  patience: 10
  batch_size: 1
  gradient_accumulation: 1
  allow_missing_tune: false

reports:
  heatmaps:
    enabled: false
    cmap: coolwarm
    alpha: 0.5
    blur_sigma: 0.0

# detection-benchmark rung 4 (#235) — multi-FM ensemble (top3: genbio-pathfm + h-optimus-1 + virchow2) on MIDOG.
#
# The MIDOG base recipe with the single encoder replaced by a `composite:` block:
# each member is extracted into its own standard dense cache (pure cache hits after the
# ranking sweep — uniform 448 px window / 0.25 overlap), then channel-concatenated at
# load time on the finest member token grid (`concat_resolution: grid`), with per-member
# l2 normalization so no encoder dominates the decoder's 1x1 projection. Everything
# below the projection is identical to the single-encoder cells (fairness invariant).
# Seed / data paths / output root are overridden per cell via `--set`, mirroring
# examples/detection_benchmark/campaign.py.

run:
  output_root: output/detection_benchmark/ensemble/midog_top3
  seed: 0
  tags: [detection-benchmark, midog, detection, lightweight_conv, ensemble, top3]

preprocessing:
  requested_tile_size_px: 1024      # tile/supervision size (OCELOT geometry; tiled ROIs)
  requested_spacing_um: 0.25
  # MIDOG mixes scanners/resolutions; a 0.10 tolerance admits each region at the task
  # spacing (design: preprocessing.tolerance = 0.10 for MIDOG).
  tolerance: 0.10
  dense_window_size: 448            # encoder sliding window within each 1024 tile
  dense_window_overlap: 0.25

data:
  dataset_csv: /data/pathology/projects/clement/code/soma/data/midog/curated/dataset.csv
  splits_csv: /data/pathology/projects/clement/code/soma/data/midog/curated/splits.csv
  dataset_type: detection

cache:
  # fp16 dense grids halve on-disk size (~128 MB -> ~64 MB per 1024 tile at 768-dim).
  # MIDOG's 16,992 tiles make the fp32 default (~2.2 TB for a single encoder) infeasible;
  # fp16 (~1.1 TB) fits and is numerically ~identical for frozen features. The driver sets
  # cache.root_dir; the fp16 key differs from any fp32 cache so this forces a fresh extract.
  dtype: fp16

composite:
  # feature_kind cross-defaults to patch_features for the trained-decoder path;
  # the common grid defaults to the finest member grid (concat_grid_size unset).
  concat_resolution: grid
  encoders:
    - name: genbio-pathfm
      member_norm: l2
      batch_size: 8
      allow_non_recommended_settings: true
    - name: h-optimus-1
      member_norm: l2
      batch_size: 8
      allow_non_recommended_settings: true
    - name: virchow2
      member_norm: l2
      batch_size: 8
      allow_non_recommended_settings: true

decoder:
  name: lightweight_conv

task:
  name: detection
  params:
    num_classes: 1            # single mitotic-figure class
    match_distance: 7.5       # δ in µm (MIDOG-native, ~one nucleus)
    sigma: 2.5                # target Gaussian σ in µm (≈ δ/3)
    matching: hungarian       # MIDOG-native one-to-one matching
    foreground_weight: 10.0

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall]

training:
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adam
  scheduler: cosine
  patience: 10
  monitor: mean_f1
  monitor_mode: max
  batch_size: 1
  gradient_accumulation: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: false

# detection-benchmark rung 4 (#235) — multi-FM ensemble (top2: genbio-pathfm + h-optimus-1) on MIDOG.
#
# The MIDOG base recipe with the single encoder replaced by the `composite` encoder:
# each member is extracted into its own standard dense cache (pure cache hits after the
# ranking sweep — uniform 448 px window / 0.25 overlap), then channel-concatenated at
# load time on the finest member token grid (`concat_resolution: grid`), with per-member
# l2 normalization so no encoder dominates the decoder's 1x1 projection (ADR 0011).
# Everything below the projection is identical to the single-encoder cells (fairness
# invariant). Members are the I5 (#234) backbone-subset picks; they are pinned here by
# hand, so re-check them against the ranking report's `selections` if the sweep is rerun.
#
# Launch through the sweep driver, which sets seed / data paths / output root per cell
# and keys the cell dir by the composite label (member names joined by `+`):
#
#   python examples/detection_benchmark/campaign.py rank --data-root data \
#       --config examples/detection_benchmark/ensemble_top2_midog.yaml \
#       --datasets midog --out-root output/detection_benchmark/ensemble \
#       --set features.cache.root_dir=output/detection_benchmark/midog/feature_cache

run:
  output_dir: output/detection_benchmark/ensemble/midog_top2
  seed: 0

cohort:
  records: /data/pathology/projects/clement/code/soma/data/midog/curated/dataset.csv
  splits: /data/pathology/projects/clement/code/soma/data/midog/curated/splits.csv

features:
  encoder:
    name: composite
    params:
      # feature_kind cross-defaults to patch_features for the trained-decoder path;
      # the common grid defaults to the finest member grid (concat_grid_size unset).
      concat_resolution: grid
      members:
        - name: genbio-pathfm
          params: {allow_non_recommended_settings: true}
          execution: {batch_size: 8}
          member_norm: l2
        - name: h-optimus-1
          params: {allow_non_recommended_settings: true}
          execution: {batch_size: 8}
          member_norm: l2
  dense:
    spacing_um: 0.25
    target_size: 1024
    # MIDOG mixes scanners/resolutions; a 0.10 tolerance admits each region at the
    # task spacing.
    tolerance: 0.10
    window_size: 448
    overlap: 0.25
  cache:
    # fp16 dense grids halve on-disk size (~128 MB -> ~64 MB per 1024 tile at 768-dim).
    # MIDOG's 16,992 tiles make the fp32 default (~2.2 TB for a single encoder) infeasible;
    # fp16 (~1.1 TB) fits and is numerically ~identical for frozen features. The driver
    # sets cache.root_dir; the fp16 key differs from any fp32 cache.
    dtype: fp16

loaders:
  batch_size: 1
  num_workers: 4
  pin_memory: true

learner:
  name: dense
  params:
    decoder:
      name: lightweight_conv
    head:
      name: detection
      params:
        num_classes: 1            # single mitotic-figure class
        match_distance: 7.5       # δ in µm (MIDOG-native, ~one nucleus)
        sigma: 2.5                # target Gaussian σ in µm (≈ δ/3)
        matching: hungarian       # MIDOG-native one-to-one matching
        foreground_weight: 10.0
    optimizer:
      name: adam
      params: {lr: 1.0e-4, weight_decay: 1.0e-5}
    scheduler: cosine

trainer:
  max_epochs: 50
  accumulate_grad_batches: 8
  callbacks:
    - name: checkpoint
      params: {monitor: mean_f1, mode: max}
    - name: early_stopping
      params: {monitor: mean_f1, mode: max, patience: 10}

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall]

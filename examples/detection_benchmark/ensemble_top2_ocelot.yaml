# detection-benchmark rung 4 (#235) — multi-FM ensemble (top2: genbio-pathfm + h-optimus-1) on OCELOT.
#
# The OCELOT base recipe with the single encoder replaced by the `composite` encoder:
# each member is extracted into its own standard dense cache (pure cache hits after the
# ranking sweep — uniform 448 px window / 0.25 overlap), then channel-concatenated at
# load time on the finest member token grid (`concat_resolution: grid`), with per-member
# l2 normalization so no encoder dominates the decoder's 1x1 projection (ADR 0011).
# Everything below the projection is identical to the single-encoder cells (fairness
# invariant). Members are the I5 (#234) backbone-subset picks; they are pinned here by
# hand, so re-check them against the ranking report's `selections` if the sweep is rerun.
#
# Launch through the sweep driver, which sets seed / data paths / output root per cell
# and keys the cell dir by the composite label (member names joined by `+`):
#
#   python examples/detection_benchmark/campaign.py rank --data-root data \
#       --config examples/detection_benchmark/ensemble_top2_ocelot.yaml \
#       --datasets ocelot --out-root output/detection_benchmark/ensemble \
#       --set features.cache.root_dir=output/detection_benchmark/ocelot/feature_cache

run:
  output_dir: output/detection_benchmark/ensemble/ocelot_top2
  seed: 0

cohort:
  records: /data/pathology/projects/clement/code/soma/data/ocelot/curated/dataset.csv
  splits: /data/pathology/projects/clement/code/soma/data/ocelot/curated/splits.csv

features:
  encoder:
    name: composite
    params:
      # feature_kind cross-defaults to patch_features for the trained-decoder path;
      # the common grid defaults to the finest member grid (concat_grid_size unset).
      concat_resolution: grid
      members:
        - name: genbio-pathfm
          params: {allow_non_recommended_settings: true}
          execution: {batch_size: 8}
          member_norm: l2
        - name: h-optimus-1
          params: {allow_non_recommended_settings: true}
          execution: {batch_size: 8}
          member_norm: l2
  # OCELOT cell patches are flat 1024x1024 JPEGs declared at the benchmark's native
  # 0.2 µm/px. This exact-spacing request preserves their decoded RGB pixels. The 448
  # window + 0.25 overlap blends window seams.
  dense:
    spacing_um: 0.2
    target_size: 1024
    window_size: 448
    overlap: 0.25

loaders:
  batch_size: 1
  num_workers: 4
  pin_memory: true

learner:
  name: dense
  params:
    decoder:
      name: lightweight_conv
    head:
      name: detection
      params:
        num_classes: 2            # 0 = BC (background cell), 1 = TC (tumor cell)
        match_distance: 3.0       # δ in µm (OCELOT-official)
        sigma: 1.0                # target Gaussian σ in µm (≈ δ/3)
        matching: hungarian       # headline; greedy is OCELOT's official ranking scorer
        foreground_weight: 10.0
    optimizer:
      name: adam
      params: {lr: 1.0e-4, weight_decay: 1.0e-5}
    scheduler: cosine

trainer:
  max_epochs: 50
  accumulate_grad_batches: 8
  callbacks:
    - name: checkpoint
      params: {monitor: mean_f1, mode: max}
    - name: early_stopping
      params: {monitor: mean_f1, mode: max, patience: 10}

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall, mean_f1_per_image]

name: PR Test Suite

on:
  # PRs need not be up to date with main before merging, so re-test main after
  # each merge to catch semantic conflicts between independently-green PRs
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    # skip the costly suite for release-* bump PRs (pyproject version-only change)
    if: ${{ !startsWith(github.head_ref, 'release-') }}

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The branch ruleset requires the `docker-test` status check, so this job
      # must always run and report success — even on docs-only PRs. We keep the
      # job (and its name) intact, but skip the costly Docker build + suite when
      # the PR touches nothing but docs. Conservative default: run the suite
      # unless the diff is purely under docs/.
      - name: Determine whether code changed
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event: running the full suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          files="$(git diff --name-only "${base}...${head}")"
          echo "Changed files:"
          echo "$files"
          if echo "$files" | grep -qvE '^docs/'; then
            echo "Non-docs paths changed -> running the full suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change -> skipping the Dockerized suite."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Buildx setup pulls moby/buildkit and Dockerfile.ci pulls ubuntu:22.04,
      # both from Docker Hub. Anonymous pulls from shared runner IPs hit Docker
      # Hub's rate limit (429), and BuildKit still checks the base image
      # manifest on a full cache hit, so log in before Buildx setup. Fork PRs
      # get no secrets, so they skip this step and fall back to anonymous pulls.
      - name: Log in to Docker Hub
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.scope.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Free disk space on runner
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Build CI image
        if: steps.scope.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          tags: soma-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run full test suite in container
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/opt/app" \
            soma-ci:${{ github.sha }} \
            bash -lc "python -m pip install --no-cache-dir -c /tmp/constraints-cu128.txt '/opt/app[dev]' pytest pytest-cov && python -m pytest -q tests -k 'not prism_slide_feature_matches_slide2vec_gt'"

      - name: Guard required secret
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN is required but not set"; exit 1; }

      - name: Run PRISM regression in container
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          SOMA_RUN_PRISM_REGRESSION: "1"
        run: |
          set -euo pipefail
          docker run --rm \
            --shm-size=2g \
            -e HF_TOKEN="$HF_TOKEN" \
            -e SOMA_RUN_PRISM_REGRESSION="$SOMA_RUN_PRISM_REGRESSION" \
            -v "$GITHUB_WORKSPACE:/opt/app" \
            soma-ci:${{ github.sha }} \
            bash -lc "python -m pip install --no-cache-dir -c /tmp/constraints-cu128.txt '/opt/app[dev]' pytest pytest-cov && python -m pytest -q tests/test_regression_fixtures.py -k prism_slide_feature_matches_slide2vec_gt"

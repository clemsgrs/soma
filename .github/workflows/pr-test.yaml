name: PR Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  regression-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel hatchling
          python -m pip install \
            --no-build-isolation \
            --constraint constraints-cu128.txt \
            ".[dev]"

      - name: Run regression and contract guard tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_config.py \
            tests/test_cache.py \
            tests/test_features.py \
            tests/test_extraction.py \
            tests/test_regression_fixtures.py \
            -k "not prism_slide_feature_matches_slide2vec_gt"

  docker-test:
    needs: regression-guards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space on runner
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          tags: soma-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run full test suite in container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/opt/app" \
            soma-ci:${{ github.sha }} \
            bash -lc "python -m pytest -q tests -k 'not prism_slide_feature_matches_slide2vec_gt'"

      - name: Guard required secret
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN is required but not set"; exit 1; }

      - name: Run PRISM regression in container
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SOMA_RUN_PRISM_REGRESSION: "1"
        run: |
          set -euo pipefail
          docker run --rm \
            -e HF_TOKEN="$HF_TOKEN" \
            -e SOMA_RUN_PRISM_REGRESSION="$SOMA_RUN_PRISM_REGRESSION" \
            -v "$GITHUB_WORKSPACE:/opt/app" \
            soma-ci:${{ github.sha }} \
            bash -lc "python -m pytest -q tests/test_regression_fixtures.py -k prism_slide_feature_matches_slide2vec_gt"

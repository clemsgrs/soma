# detection-benchmark — MIDOG 2022 mitosis detection, native spacing (0.25 µm/px).
#
# Per-dataset BASE config for the encoder-ranking sweep (#246). Recipe backbone fixed —
# frozen encoder -> dense token grid -> lightweight_conv decoder -> single-class peak
# heatmap, scored with the MIDOG-native F1 (one-to-one/Hungarian match within 7.5 µm,
# ~one nucleus). Only ``encoder.name`` varies across the roster.
#
# Spacing note: every ROI stays in its native pixel grid and is evaluated in one nominal
# 0.25 µm/px frame. This intentionally approximates scanner-level spacing variation (the
# protocol would accept native spacings within 10% of 0.25 if multi-resolution reads were
# available). It is identical across encoders, and these numbers are already declared
# non-leaderboard-comparable (local held-out split). The tiles are flat PNGs read at NATIVE
# resolution (spacing is a label, not a resample), so
# level0_spacing MUST equal requested_spacing_um — the tiler enforces a uniform level0_spacing
# and `--target-spacing 0.25` pins it. The 0.10 reader tolerance only relaxes the hard
# spacing-mismatch check for the (unused, flat-read) tolerance path.
#
# MIDOG ships large, variable-size ROIs (soma's dense detection path needs fixed-size
# tiles), so the manifest the sweep consumes (``curated``) is the TILED one
# (soma.curation.tile_detection): fixed 1024² tiles at 128 px overlap, produced from the
# ROI-level curator output (kept alongside as ``midog/roi/``). This reuses OCELOT's proven
# fixed-tile geometry — requested_tile_size_px 1024 (the supervision unit) with a 448 px
# encoder sliding window — and the score path stitches per-tile detections back to the
# native per-ROI F1. Data paths are the curator's author-machine defaults; the driver
# repoints them.

run:
  output_root: output/detection_benchmark/midog
  seed: 0
  tags: [detection-benchmark, midog, detection, lightweight_conv]

preprocessing:
  requested_tile_size_px: 1024      # tile/supervision size (OCELOT geometry; tiled ROIs)
  requested_spacing_um: 0.25
  # MIDOG mixes scanners/resolutions; a 0.10 tolerance admits each region at the task
  # spacing (design: preprocessing.tolerance = 0.10 for MIDOG).
  tolerance: 0.10
  dense_window_size: 448            # encoder sliding window within each 1024 tile
  dense_window_overlap: 0.25

data:
  dataset_csv: /data/pathology/projects/clement/code/soma/data/midog/curated/dataset.csv
  splits_csv: /data/pathology/projects/clement/code/soma/data/midog/curated/splits.csv
  dataset_type: detection

cache:
  # fp16 dense grids halve on-disk size (~128 MB -> ~64 MB per 1024 tile at 768-dim).
  # MIDOG's 16,992 tiles make the fp32 default (~2.2 TB for a single encoder) infeasible;
  # fp16 (~1.1 TB) fits and is numerically ~identical for frozen features. The driver sets
  # cache.root_dir; the fp16 key differs from any fp32 cache so this forces a fresh extract.
  dtype: fp16

encoder:
  name: virchow2
  batch_size: 8
  allow_non_recommended_settings: true

decoder:
  name: lightweight_conv

task:
  name: detection
  params:
    num_classes: 1            # single mitotic-figure class
    match_distance: 7.5       # δ in µm (MIDOG-native, ~one nucleus)
    sigma: 2.5                # target Gaussian σ in µm (≈ δ/3)
    matching: hungarian       # MIDOG-native one-to-one matching
    foreground_weight: 10.0
    level0_spacing: 0.25      # nominal spacing of this native-pixel manifest

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall]

training:
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adam
  scheduler: cosine
  patience: 10
  monitor: mean_f1
  monitor_mode: max
  batch_size: 1
  gradient_accumulation: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: false

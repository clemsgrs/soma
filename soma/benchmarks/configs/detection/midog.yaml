# detection-benchmark — MIDOG 2022 mitosis detection, native spacing (0.25 µm/px).
#
# Per-dataset BASE config for the encoder-ranking sweep (#246). Recipe backbone fixed —
# frozen encoder -> dense token grid -> lightweight_conv decoder -> single-class peak
# heatmap, scored with the MIDOG-native F1 (one-to-one/Hungarian match within 7.5 µm,
# ~one nucleus). Only ``features.encoder.name`` varies across the roster.
#
# Spacing note: every ROI stays in its native pixel grid and is evaluated in one nominal
# 0.25 µm/px frame. This intentionally approximates scanner-level spacing variation. It is
# identical across encoders, and these numbers are already declared
# non-leaderboard-comparable (local held-out split). The tiles are flat PNGs declared at
# the nominal spacing_at_level_0 = 0.25 (the tiler enforces a uniform value and
# `--target-spacing 0.25` pins it); since the request matches the declaration within the
# 0.10 tolerance, extraction preserves the decoded pixels exactly and the persisted
# provenance records source == effective spacing, so the point transform is the identity.
#
# MIDOG ships large, variable-size ROIs (soma's dense detection path needs fixed-size
# tiles), so the manifest the sweep consumes (``curated``) is the TILED one
# (soma.curation.tile_detection): fixed 1024² tiles at 128 px overlap, produced from the
# ROI-level curator output (kept alongside as ``midog/roi/``). This reuses OCELOT's proven
# fixed-tile geometry — a 1024 px target size (the supervision unit) with a 448 px encoder
# sliding window — and the score path stitches per-tile detections back to the native
# per-ROI F1. Data paths are the curator's author-machine defaults; the driver repoints
# them.

run:
  output_dir: output/detection_benchmark/midog
  seed: 0

cohort:
  records: /data/pathology/projects/clement/code/soma/data/midog/curated/dataset.csv
  splits: /data/pathology/projects/clement/code/soma/data/midog/curated/splits.csv

features:
  encoder:
    name: virchow2
    params:
      allow_non_recommended_settings: true
  execution:
    batch_size: 8
  dense:
    spacing_um: 0.25
    target_size: 1024     # tile/supervision size (OCELOT geometry; tiled ROIs)
    # MIDOG mixes scanners/resolutions; a 0.10 tolerance admits each region at the task
    # spacing.
    tolerance: 0.10
    window_size: 448      # encoder sliding window within each 1024 tile
    overlap: 0.25
  cache:
    # fp16 dense grids halve on-disk size (~128 MB -> ~64 MB per 1024 tile at 768-dim).
    # MIDOG's 16,992 tiles make the fp32 default (~2.2 TB for a single encoder) infeasible;
    # fp16 (~1.1 TB) fits and is numerically ~identical for frozen features. The driver
    # sets cache.root_dir; the fp16 key differs from any fp32 cache.
    dtype: fp16

loaders:
  batch_size: 1
  num_workers: 4
  pin_memory: true

learner:
  name: dense
  params:
    decoder:
      name: lightweight_conv
    head:
      name: detection
      params:
        num_classes: 1            # single mitotic-figure class
        match_distance: 7.5       # δ in µm (MIDOG-native, ~one nucleus)
        sigma: 2.5                # target Gaussian σ in µm (≈ δ/3)
        matching: hungarian       # MIDOG-native one-to-one matching
        foreground_weight: 10.0
    optimizer:
      name: adam
      params: {lr: 1.0e-4, weight_decay: 1.0e-5}
    scheduler: cosine

trainer:
  max_epochs: 50
  accumulate_grad_batches: 8
  callbacks:
    - name: checkpoint
      params: {monitor: mean_f1, mode: max}
    - name: early_stopping
      params: {monitor: mean_f1, mode: max, patience: 10}

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall]

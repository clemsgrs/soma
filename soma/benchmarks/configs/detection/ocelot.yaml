# detection-benchmark — OCELOT 2023 cell detection, native spacing (0.2 µm/px).
#
# Per-dataset BASE config for the multi-dataset encoder-ranking sweep (#246). The recipe
# backbone is fixed here — frozen encoder -> dense token grid -> lightweight_conv decoder ->
# per-class peak heatmap, scored with class-aware greedy F1@δ (δ = 3 µm, OCELOT-official).
# The only axis that varies across the roster is ``features.encoder.name``; the harness'
# ``build_config(encoder, "ocelot")`` loads this file and overrides the encoder, so a
# roster of any size reuses one committed config (no per-encoder YAML to maintain).
#
# Data paths are the curator's default author-machine paths; the driver repoints them per
# replicate in the config it launches (or ``build_config(dataset_csv=..., splits_csv=...)``).

run:
  output_dir: output/detection_benchmark/ocelot
  seed: 0

cohort:
  records: /data/pathology/projects/clement/code/soma/data/ocelot/curated/dataset.csv
  splits: /data/pathology/projects/clement/code/soma/data/ocelot/curated/splits.csv

features:
  encoder:
    # Roster placeholder — the harness overrides the name per cell. Off-recommended
    # spacings are allowed so every roster encoder reads at OCELOT's native 0.2 µm/px.
    name: virchow2
    params:
      allow_non_recommended_settings: true
  execution:
    batch_size: 8
  # OCELOT cell patches are flat 1024x1024 JPEGs declared at the benchmark's native
  # 0.2 µm/px. This exact-spacing request preserves their decoded RGB pixels. The 448
  # window + 0.25 overlap blends window seams.
  dense:
    spacing_um: 0.2
    target_size: 1024
    window_size: 448
    overlap: 0.25

loaders:
  batch_size: 1
  num_workers: 4
  pin_memory: true

learner:
  name: dense
  params:
    decoder:
      name: lightweight_conv
    head:
      name: detection
      params:
        num_classes: 2            # 0 = BC (background cell), 1 = TC (tumor cell)
        match_distance: 3.0       # δ in µm (OCELOT-official)
        sigma: 1.0                # target Gaussian σ in µm (≈ δ/3)
        matching: hungarian       # headline; greedy is OCELOT's official ranking scorer
        foreground_weight: 10.0
    optimizer:
      name: adam
      params: {lr: 1.0e-4, weight_decay: 1.0e-5}
    scheduler: cosine

trainer:
  max_epochs: 50
  accumulate_grad_batches: 8
  callbacks:
    - name: checkpoint
      params: {monitor: mean_f1, mode: max}
    - name: early_stopping
      params: {monitor: mean_f1, mode: max, patience: 10}

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall, mean_f1_per_image]

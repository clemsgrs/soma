# detection-benchmark — OCELOT 2023 cell detection, native spacing (0.2 µm/px).
#
# Per-dataset BASE config for the multi-dataset encoder-ranking sweep (#246). The recipe
# backbone is fixed here — frozen encoder -> dense token grid -> lightweight_conv decoder ->
# per-class peak heatmap, scored with class-aware greedy F1@δ (δ = 3 µm, OCELOT-official).
# The only axis that varies across the roster is ``encoder.name``; the harness'
# ``build_config(encoder, "ocelot")`` loads this file and overrides the encoder, so a
# roster of any size reuses one committed config (no per-encoder YAML to maintain).
#
# Data paths are the curator's default author-machine paths; the driver repoints them per
# replicate via ``--set`` (or ``build_config(dataset_csv=..., splits_csv=...)``).

run:
  output_root: output/detection_benchmark/ocelot
  seed: 0
  tags: [detection-benchmark, ocelot, detection, lightweight_conv]

data:
  dataset_csv: /data/pathology/projects/clement/code/soma/data/ocelot/curated/dataset.csv
  splits_csv: /data/pathology/projects/clement/code/soma/data/ocelot/curated/splits.csv
  dataset_type: detection

preprocessing:
  # OCELOT cell patches are flat 1024x1024 JPEGs at ~0.194 µm/px; the reader reads them at
  # native resolution and ignores requested_spacing_um (kept to pin the µm->px conversions
  # and self-document the cache key). The 448 window + 0.25 overlap blends window seams.
  requested_tile_size_px: 1024
  requested_spacing_um: 0.2
  dense_window_size: 448
  dense_window_overlap: 0.25

encoder:
  # Roster placeholder — the harness overrides encoder.name per cell. Off-recommended
  # spacings are allowed so every roster encoder reads at OCELOT's native 0.2 µm/px.
  name: virchow2
  batch_size: 8
  allow_non_recommended_settings: true

decoder:
  name: lightweight_conv

task:
  name: detection
  params:
    num_classes: 2            # 0 = BC (background cell), 1 = TC (tumor cell)
    match_distance: 3.0       # δ in µm (OCELOT-official)
    sigma: 1.0                # target Gaussian σ in µm (≈ δ/3)
    matching: hungarian       # headline; greedy is OCELOT's official ranking scorer
    foreground_weight: 10.0

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall, mean_f1_per_image]

training:
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adam
  scheduler: cosine
  patience: 10
  monitor: mean_f1
  monitor_mode: max
  batch_size: 1
  gradient_accumulation: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: false

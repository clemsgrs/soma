# detection-benchmark — MONKEY inflammatory-cell detection, native spacing (0.242 µm/px).
#
# Per-dataset BASE config for the encoder-ranking sweep (#246). Recipe backbone fixed —
# frozen encoder -> dense token grid -> lightweight_conv decoder -> per-class peak heatmap,
# scored with the MONKEY-native FROC (mean of the per-class FROC scores; lymphocytes 4 µm /
# monocytes 5 µm matching margins). Only ``encoder.name`` varies across the roster.
#
# MONKEY annotates cells only inside ROI polygons on whole slides. The curator crops one
# flat PNG per ROI with an ignore mask (the polygon dilated by 5 µm), and the manifest the
# sweep consumes (``curated``) is the TILED one (soma.curation.tile_detection), produced
# from that ROI-level output (kept alongside as ``curated/roi/``). The geometry is MIDOG's:
# fixed 1024² tiles at 128 px overlap, supervised at requested_tile_size_px 1024 with a
# 448 px encoder sliding window. The score path stitches per-tile detections back to each
# ROI, and FROC divides false positives by the ROI's valid area. The splits are a 5-fold
# patient cross-validation, so each fold is one replicate. Data paths are the curator's
# author-machine defaults; the driver repoints them per replicate.

run:
  output_root: output/detection_benchmark/monkey
  seed: 0
  tags: [detection-benchmark, monkey, detection, lightweight_conv]

preprocessing:
  requested_tile_size_px: 1024      # tile/supervision size (MIDOG geometry; tiled ROIs)
  requested_spacing_um: 0.242
  dense_window_size: 448            # encoder sliding window within each 1024 tile
  dense_window_overlap: 0.25

cache:
  # fp16 dense grids halve the on-disk cache for the larger encoders (as for MIDOG); frozen
  # features are numerically ~identical. The driver sets cache.root_dir.
  dtype: fp16

data:
  dataset_csv: /data/pathology/projects/clement/code/soma/data/monkey/curated/dataset.csv
  splits_csv: /data/pathology/projects/clement/code/soma/data/monkey/curated/splits.csv
  dataset_type: detection

encoder:
  name: virchow2
  batch_size: 8
  allow_non_recommended_settings: true

decoder:
  name: lightweight_conv

task:
  name: detection
  params:
    num_classes: 2            # 0 = lymphocytes, 1 = monocytes (merged MNL pooled at score time)
    match_distance: 5.0       # δ in µm — per-class margins (4/5 µm) are applied by the FROC scorer
    sigma: 1.7                # target Gaussian σ in µm (≈ δ/3)
    matching: greedy          # FROC uses greedy-by-confidence matching
    foreground_weight: 10.0

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall]

training:
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adam
  scheduler: cosine
  patience: 10
  monitor: mean_f1
  monitor_mode: max
  batch_size: 1
  gradient_accumulation: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: false

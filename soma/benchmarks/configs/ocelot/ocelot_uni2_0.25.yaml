# OCELOT 2023 cell-detection — encoder×spacing ablation: UNI2 @ 0.25 µm/px.
#
# Frozen UNI2 -> dense token grid -> conv decoder -> per-class peak heatmap, scored
# with class-aware F1@δ (δ = 3 µm, OCELOT's official tolerance). The one native
# OCELOT Manifest declares 0.2 µm/px; slide2vec reads it at 0.25 µm/px on demand.
# See examples/ocelot/README.md for the workflow.
#   python -m soma.curation.ocelot \
#     --raw-root   /data/pathology/projects/clement/code/soma/data/ocelot \
#     --output-dir /data/pathology/projects/clement/code/soma/data/ocelot/curated
# Then run:  python -m soma soma/benchmarks/configs/ocelot/ocelot_uni2_0.25.yaml
#   (or, preferred, drive the registered benchmark: soma reproduce ocelot)

run:
  output_dir: output/ocelot_uni2_0p25_lightconv
  seed: 0

cohort:
  records: /data/pathology/projects/clement/code/soma/data/ocelot/curated/dataset.csv
  splits: /data/pathology/projects/clement/code/soma/data/ocelot/curated/splits.csv

features:
  encoder:
    name: uni2
    params:
      allow_non_recommended_settings: true   # 0.25 µm/px is below UNI2's recommended 20x (0.5) regime — off-distribution on purpose
  execution:
    batch_size: 8
  # Native JPEGs declare 0.2 µm/px; slide2vec area-downsamples them to this request.
  # The 448 window + 0.25 overlap blends window seams / border artifacts.
  dense:
    spacing_um: 0.25
    target_size: 819   # round(1024 × 0.2/0.25); v1 needs target_size == read size
    window_size: 448
    overlap: 0.25

# The decoder upsamples the grid to a full-tile heatmap; batch 1 on a 12 GB card.
loaders:
  batch_size: 1
  num_workers: 4
  pin_memory: true

learner:
  name: dense
  params:
    decoder:
      name: lightweight_conv
    head:
      name: detection
      params:
        num_classes: 2            # 0 = BC (background cell), 1 = TC (tumor cell)
        match_distance: 3.0       # δ in µm (OCELOT-official)
        sigma: 1.0                # target Gaussian σ in µm (≈ δ/3)
        matching: hungarian       # headline; greedy is OCELOT's official scorer
        foreground_weight: 10.0
    optimizer:
      name: adam
      params: {lr: 1.0e-4, weight_decay: 1.0e-5}
    scheduler: cosine

trainer:
  max_epochs: 50
  accumulate_grad_batches: 8
  callbacks:
    - name: checkpoint
      params: {monitor: mean_f1, mode: max}
    - name: early_stopping
      params: {monitor: mean_f1, mode: max, patience: 10}

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall, mean_f1_per_image]

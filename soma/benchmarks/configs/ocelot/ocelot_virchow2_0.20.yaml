# OCELOT 2023 cell-detection — encoder×spacing ablation: Virchow2 @ 0.2 µm/px (native anchor).
#
# Frozen Virchow2 -> dense token grid -> conv decoder -> per-class peak heatmap, scored
# with class-aware F1@δ (δ = 3 µm, OCELOT's official tolerance). This is the native-spacing
# anchor of the 2x2 + native ablation; every spacing protocol consumes the same native
# Manifest. See examples/ocelot/README.md for the workflow.
#   python -m soma.curation.ocelot \
#     --raw-root   /data/pathology/projects/clement/code/soma/data/ocelot \
#     --output-dir /data/pathology/projects/clement/code/soma/data/ocelot/curated
# Then run:  python -m soma soma/benchmarks/configs/ocelot/ocelot_virchow2_0.20.yaml
#   (or, preferred, drive the registered benchmark: soma reproduce ocelot)
#
# slide2vec >= 5.0.1 is required to *run* Virchow2 (it loads without it).

run:
  output_root: output/ocelot_virchow2_0p20_lightconv
  seed: 0
  tags: [ocelot, detection, virchow2, lightweight_conv, spacing_0p20]

data:
  dataset_csv: /data/pathology/projects/clement/code/soma/data/ocelot/curated/dataset.csv
  splits_csv: /data/pathology/projects/clement/code/soma/data/ocelot/curated/splits.csv
  dataset_type: detection

preprocessing:
  # OCELOT cell patches are flat 1024x1024 JPEGs declared at 0.2 µm/px. The exact-spacing
  # request preserves their native pixels and pins the physical coordinate transforms and
  # cache identity. The 448 window + 0.25 overlap covers the non-even tiling of 1024 and
  # blends window seams / border artifacts.
  requested_tile_size_px: 1024
  requested_spacing_um: 0.2
  dense_window_size: 448
  dense_window_overlap: 0.25

encoder:
  name: virchow2
  batch_size: 8
  allow_non_recommended_settings: true   # 0.2 µm/px is below Virchow2's finest recommended spacing (0.25) — native-anchor probe, off-recommended on purpose

decoder:
  name: lightweight_conv

task:
  name: detection
  params:
    num_classes: 2            # 0 = BC (background cell), 1 = TC (tumor cell)
    match_distance: 3.0       # δ in µm (OCELOT-official)
    sigma: 1.0                # target Gaussian σ in µm (≈ δ/3)
    matching: hungarian       # headline; greedy is OCELOT's official scorer
    foreground_weight: 10.0

evaluation:
  metrics: [mean_f1, f1_per_class, precision, recall, mean_f1_per_image]

training:
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adam
  scheduler: cosine
  patience: 10
  monitor: mean_f1
  monitor_mode: max
  # Decoder upsamples the grid to a 1024x1024x2 heatmap; batch 1 on a 12 GB card
  batch_size: 1
  gradient_accumulation: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: false
